<text x="15" y="68" font-size="2.6" font-family="Arial, sans-serif" font-weight="700" text-anchor="start" fill="#0b111e">Total : 14,7 kg d'acier pour une poutrelle de 4,00 m</text>
<text x="15" y="82" font-size="3.4" font-family="Arial, sans-serif" font-weight="700" text-anchor="start" fill="#0b111e">Métré</text>
<text x="15" y="89" font-size="2.4" font-family="Arial, sans-serif" font-weight="700" text-anchor="start" fill="#0b111e">Béton : 0,192 m³ (poutrelle et dalle, sur 4,00 m × entraxe 0,60 m)</text>
<text x="15" y="94" font-size="2.4" font-family="Arial, sans-serif" font-weight="700" text-anchor="start" fill="#0b111e">Acier : 14,7 kg — 6,14 kg/m² de plancher</text>
<text x="15" y="99" font-size="2.4" font-family="Arial, sans-serif" text-anchor="start" fill="#0b111e">   HA6 : 3,5 kg</text>
<text x="15" y="104" font-size="2.4" font-family="Arial, sans-serif" text-anchor="start" fill="#0b111e">   HA10 : 2,5 kg</text>
<text x="15" y="109" font-size="2.4" font-family="Arial, sans-serif" text-anchor="start" fill="#0b111e">   HA12 : 8,8 kg</text>
<text x="185" y="82" font-size="3.4" font-family="Arial, sans-serif" font-weight="700" text-anchor="start" fill="#0b111e">Hypothèses et résultats</text>
<text x="185" y="89" font-size="2.3" font-family="Arial, sans-serif" text-anchor="start" fill="#0b111e">Béton C25/30 — acier B500 — exposition XC1 — cnom 25 mm</text>
<text x="185" y="94" font-size="2.3" font-family="Arial, sans-serif" text-anchor="start" fill="#0b111e">Poutrelle continue (3 travées et plus, coefficients forfaitaires) — L = 4,00 m — entraxe 0,60 m</text>
<text x="185" y="99" font-size="2.3" font-family="Arial, sans-serif" text-anchor="start" fill="#0b111e">Section : dalle hf = 40 mm, entrevous 200 mm, âme bw = 120 mm (h = 240 mm)</text>
<text x="185" y="104" font-size="2.3" font-family="Arial, sans-serif" text-anchor="start" fill="#0b111e">Moments ELU : M+ = 10,0 kN·m en travée, M− = −6,3 kN·m sur appui — VEd = 13,8 kN</text>
<text x="185" y="109" font-size="2.3" font-family="Arial, sans-serif" text-anchor="start" fill="#0b111e">Flèche à long terme : 5,1 mm — 27 / 27 vérifications satisfaites</text>
<text x="185" y="114" font-size="2.3" font-family="Arial, sans-serif" font-weight="700" text-anchor="start" fill="#0b111e">Verdict : CONFORME (pré-dimensionnement, à valider par un ingénieur structure)</text>
<text x="15" y="130" font-size="3.4" font-family="Arial, sans-serif" font-weight="700" text-anchor="start" fill="#0b111e">Notes</text>
<text x="15" y="137" font-size="2.3" font-family="Arial, sans-serif" text-anchor="start" fill="#0b111e">Enrobage nominal 25 mm au nu des étriers (XC1, Δcdev = 10 mm).</text>
<text x="15" y="142" font-size="2.3" font-family="Arial, sans-serif" text-anchor="start" fill="#0b111e">Ancrage des aciers de travée : lbd = 484 mm de part et d'autre de l'axe de chaque appui (barres droites).</text>
<text x="15" y="147" font-size="2.3" font-family="Arial, sans-serif" text-anchor="start" fill="#0b111e">Étriers triangulaires fermés : crochet de fermeture à 135°, queue de 10Φ (EN ISO 3766 / NF A 35-027).</text>
<text x="15" y="152" font-size="2.3" font-family="Arial, sans-serif" text-anchor="start" fill="#0b111e">Les chapeaux de rive d'une poutrelle continue sont des aciers de construction, non métrés.</text>
<text x="15" y="157" font-size="2.3" font-family="Arial, sans-serif" text-anchor="start" fill="#0b111e">Cotes en millimètres, sauf mention contraire. Plan issu du pré-dimensionnement : à adapter aux plans de repérage du chantier.</text>
